apiVersion: apps/v1
kind: Deployment
metadata:
  name: cristal-backend
  labels:
    app: cristal-backend
    dxp.io/managed: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cristal-backend
  template:
    metadata:
      labels:
        app: cristal-backend
        backstage.io/kubernetes-id: cristal-backend
    spec:
      nodeSelector:
        role: workload
      tolerations:
      - key: role
        operator: Equal
        value: workload
        effect: NoSchedule
      containers:
      - name: cristal-backend
        image: harbor.harbor.svc.cluster.local/dxp/cristal-backend:34658b8
        imagePullPolicy: Always
        env:
        - name: ALLOWED_ORIGINS
          value: "http://cristal-web.68.221.5.247.nip.io:30080"
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cristal-backend
spec:
  selector:
    app: cristal-backend
  ports:
  - port: 80
    targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cristal-backend
  labels:
    app: cristal-backend
    dxp.io/managed: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: cristal-backend.68.221.5.247.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cristal-backend
            port:
              number: 80
